openapi: 3.1.0
info:
  title: SuguVisa — 特定技能ビザ申請AI API
  description: |
    日本の特定技能（SSW: Specified Skilled Worker）ビザ申請を完全自動化するAPIです。
    行政書士・登録支援機関・受入れ機関・外国人申請者本人が使えます。
    
    ## できること
    - 🔍 申請種別の自動判定（技能実習→特定技能、転職、更新、2号移行など全パターン）
    - 📋 必要書類リスト（省略条件を自動適用し、本当に必要な書類だけ返す）
    - ⏰ 期限計算（14日届出ルール、更新申請3ヶ月前、通算5年上限チェック）
    - ✅ データ検証（在留カード番号、法人番号、日付形式のリアルタイムチェック）
    - 📊 定期報告CSV/Excel生成（オンライン提出・紙提出の両方に対応）
    - ⚖️ 法改正情報（最新の制度変更を自動追跡）
    
    ## 基本的なワークフロー
    1. `/determine` — 現在のビザと目標ビザから申請パターンを判定（まずこれを呼ぶ）
    2. `/required-documents` — pattern_id を使って必要書類を取得
    3. `/deadlines` — 在留期限等から各種期限を計算
    4. `/validate` — 申請データの入力値を検証
  version: 0.2.0
  contact:
    name: スグクル株式会社
    email: a_kabe@sugu-kuru.co.jp

servers:
  - url: https://suguvisa-mcp-731026511067.asia-northeast1.run.app/api/v1/tools
    description: Production (Cloud Run)
  - url: http://localhost:3000/api/v1/tools
    description: Local development

paths:
  /determine:
    post:
      operationId: determineApplicationType
      summary: 申請パターンを自動判定する（最初に呼ぶ）
      description: |
        現在の在留資格と申請先の在留資格から、正式な申請種別（変更・更新・認定）、使用様式、標準処理期間、試験免除条件を瞬時に特定します。
        技能実習→特定技能、転職、更新、2号移行など全パターンに対応。
        返却される pattern_id は他のエンドポイント（/required-documents 等）で使います。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_visa, to_visa]
              properties:
                from_visa:
                  type: string
                  description: 現在の在留資格（例 "技能実習2号", "特定技能1号"）
                to_visa:
                  type: string
                  description: 申請する在留資格（例 "特定技能1号", "特定技能2号"）
                context:
                  type: string
                  description: 追加コンテキスト（例 "転職", "更新", "2号移行準備"）
                has_supervisor_experience:
                  type: boolean
                  description: 特定技能2号用：班長等の指導・監督実務経験があるか
      responses:
        '200':
          description: 判定結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [found, not_found]
                  pattern_id:
                    type: string
                    description: 必要書類取得などで使用するパターンID
                  formal_name:
                    type: string
                  description:
                    type: string
                  typical_processing_days:
                    type: string

  /required-documents:
    post:
      operationId: getRequiredDocuments
      summary: 必要書類リストを取得する（省略条件自動適用）
      description: |
        申請パターンIDに基づき、入管提出に必要な全書類をカテゴリ別に返します。
        「2年以内の同一機関申請で省略可」「自社支援なら不要」等の省略条件を自動適用し、
        実際に準備が必要な書類だけをリストアップ。各書類の入手方法も含みます。
        pattern_id は /determine で取得してください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern_id]
              properties:
                pattern_id:
                  type: string
                  description: "申請パターンID（例: CHANGE_SSW1_C）— determine で取得"
                support_type:
                  type: string
                  enum: [self, delegated]
                  default: delegated
                  description: 支援体制（self=自社支援, delegated=登録支援機関へ委託）
                is_same_employer_2year:
                  type: boolean
                  default: false
                  description: 2年以内に同一機関から申請したか（一部書類免除判定用）
                is_domestic:
                  type: boolean
                  default: true
                  description: 国内申請か海外からの呼び寄せか
                industry_field:
                  type: string
                  description: "特定産業分野（例: 農業, 飲食料品製造業）"
                employer_type:
                  type: string
                  enum: [corporate, individual]
                  default: corporate
      responses:
        '200':
          description: 必要書類リスト
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  total_documents:
                    type: integer
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        category:
                          type: string
                        skipped:
                          type: boolean

  /deadlines:
    post:
      operationId: calculateDeadlines
      summary: 全期限を自動計算する（14日ルール・更新時期・5年上限）
      description: |
        在留期限・届出発生日等から、すべての重要な期限を算出します。
        - 随時届出の14日ルール期限
        - 更新申請の開始可能日（3ヶ月前）と推奨時期
        - 通算在留5年上限までの残日数
        - 認定証明書（COE）の有効期限
        期限切れリスクは危険度レベル（🟢🟡🔴）で色分けされます。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expiry_date:
                  type: string
                  format: date
                  description: 在留期限（YYYY-MM-DD）
                event_date:
                  type: string
                  format: date
                  description: 届出事由の発生日（YYYY-MM-DD）
                ssw1_start_date:
                  type: string
                  format: date
                  description: 特定技能1号の通算開始日（YYYY-MM-DD）
                coe_issue_date:
                  type: string
                  format: date
                  description: 認定証明書交付日（YYYY-MM-DD）
      responses:
        '200':
          description: 期限計算結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  today:
                    type: string
                  deadlines:
                    type: array
                    items:
                      type: object

  /validate:
    post:
      operationId: validateApplicationData
      summary: 申請データをリアルタイム検証する
      description: |
        在留カード番号（12桁英数字）、法人番号（13桁）、日付形式、電話番号等の入力値を検証します。
        入管への提出前にデータ不備を検出し、補正指示のリスクを大幅に低減。
        エラーがある場合は具体的な修正方法を提案します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  description: "検証するフィールドのキー/値（例: {\"residence_card_number\": \"AB12345678CD\"}）"
      responses:
        '200':
          description: 検証結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [all_valid, has_errors]
                  results:
                    type: object

  /annual-report-csv:
    post:
      operationId: generateAnnualReportCsv
      summary: 定期届出CSVを生成する（オンライン提出用）
      description: |
        年1回の特定技能定期届出（受入れ状況・活動状況・支援実施状況）を、
        入管オンライン申請システムに直接アップロード可能なCSV形式で出力します。
        2025年4月改正の新フォーマットに対応。紙提出用データも同時生成されます。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reports]
              properties:
                reports:
                  type: array
                  items:
                    type: object
                  description: 報告対象の申請人データ配列
      responses:
        '200':
          description: CSV生成結果

  /annual-report-excel:
    post:
      operationId: generateAnnualReportExcel
      summary: 定期届出Excelを生成する（紙提出用）
      description: |
        オンライン届出を利用しない所属機関向けに、紙提出用の定期報告書をExcel形式で自動出力。
        JSONデータからセル配置まで全自動で処理します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_name, reporting_year]
              properties:
                company_name:
                  type: string
                  description: 所属機関名
                reporting_year:
                  type: integer
                  description: 報告年度（例 2026）
                paper_form_data:
                  type: array
                  items:
                    type: object
                  description: 従業員データ配列
      responses:
        '200':
          description: Excel生成結果

  /law-updates:
    get:
      operationId: getLawUpdates
      summary: 法改正・制度変更情報を取得する
      description: |
        特定技能制度に関する最新の法改正・制度変更・運用要領の改定情報を取得します。
        施行日、影響範囲、対応方法を含みます。日付・キーワード・ステータスで絞り込み可能。
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date
          description: この日付以降の更新を取得
        - name: keyword
          in: query
          schema:
            type: string
          description: キーワードで絞り込み
        - name: status
          in: query
          schema:
            type: string
          description: ステータスで絞り込み（施行済み, 施行準備中）
      responses:
        '200':
          description: 法改正情報
