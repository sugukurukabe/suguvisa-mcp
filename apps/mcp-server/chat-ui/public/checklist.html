<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特定技能2号 書類チェックリスト | SuguVisa</title>
<meta name="description" content="特定技能2号 在留資格申請の必要書類チェックリスト。分野・雇用形態別に自動生成書類とユーザー準備書類を一覧表示。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface-2: #1a1a2e;
  --surface-3: #22223a;
  --border: #2a2a44;
  --border-hover: #3a3a5e;
  --text: #e8e8f0;
  --text-muted: #8888aa;
  --text-dim: #5555777;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --green: #00b894;
  --green-bg: rgba(0,184,148,.08);
  --green-border: rgba(0,184,148,.25);
  --red: #ff6b6b;
  --red-bg: rgba(255,107,107,.08);
  --red-border: rgba(255,107,107,.25);
  --orange: #fdcb6e;
  --orange-bg: rgba(253,203,110,.08);
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Inter', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}

header {
  text-align: center;
  margin-bottom: 2rem;
  padding: 2rem;
  background: linear-gradient(135deg, rgba(108,92,231,0.1), rgba(162,155,254,0.05));
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  background: linear-gradient(135deg, #a29bfe, #6c5ce7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: .5rem;
}

header p {
  color: var(--text-muted);
  font-size: .9rem;
}

.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 600;
}

.badge-auto {
  background: var(--green-bg);
  color: var(--green);
  border: 1px solid var(--green-border);
}

.badge-user {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
}

.badge-skip {
  background: var(--orange-bg);
  color: var(--orange);
  border: 1px solid rgba(253,203,110,.25);
}

/* Field Selector */
.field-selector {
  margin-bottom: 2rem;
}

.field-selector h2 {
  font-size: 1.1rem;
  color: var(--accent-light);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: .75rem;
}

.field-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .75rem 1rem;
  color: var(--text);
  cursor: pointer;
  transition: all .2s;
  font-size: .85rem;
  text-align: left;
}

.field-btn:hover {
  border-color: var(--accent);
  background: var(--surface-2);
  transform: translateY(-1px);
}

.field-btn.active {
  border-color: var(--accent);
  background: rgba(108,92,231,0.15);
  box-shadow: 0 0 0 1px var(--accent);
}

.field-btn .count {
  display: block;
  font-size: .7rem;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Employment Type Tabs */
.emp-tabs {
  display: flex;
  gap: .5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.emp-tab {
  padding: .5rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: .8rem;
  transition: all .2s;
}

.emp-tab:hover { border-color: var(--accent); color: var(--text); }
.emp-tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* Section */
.section {
  margin-bottom: 2rem;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .75rem 1rem;
  background: var(--surface-2);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  border: 1px solid var(--border);
  border-bottom: none;
  cursor: pointer;
  user-select: none;
}

.section-header:hover { background: var(--surface-3); }

.section-header h3 {
  font-size: .95rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: .5rem;
}

.section-stats {
  display: flex;
  gap: .75rem;
  font-size: .75rem;
}

.section-stats span { display: flex; align-items: center; gap: .25rem; }

.section-body {
  border: 1px solid var(--border);
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
}

/* Document Row */
.doc-row {
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  transition: background .2s;
}

.doc-row:last-child { border-bottom: none; }
.doc-row:hover { background: rgba(255,255,255,.02); }

.doc-main {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .75rem 1rem;
  cursor: pointer;
  user-select: none;
}

.doc-checkbox {
  width: 22px; height: 22px;
  border: 2px solid var(--border);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: all .2s;
}

.doc-row.checked .doc-checkbox {
  background: var(--green);
  border-color: var(--green);
}

.doc-row.checked .doc-checkbox::after {
  content: '✓';
  color: white;
  font-size: .75rem;
  font-weight: 700;
}

.doc-row.checked .doc-name { text-decoration: line-through; color: var(--text-muted); }

.doc-no {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .75rem;
  font-weight: 600;
  flex-shrink: 0;
}

.doc-no.auto { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.doc-no.user { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

.doc-info { flex: 1; min-width: 0; }
.doc-name { font-size: .85rem; font-weight: 500; }
.doc-meta { font-size: .7rem; color: var(--text-muted); margin-top: 2px; }

.doc-expand-icon {
  color: var(--text-muted);
  font-size: .8rem;
  transition: transform .2s;
  flex-shrink: 0;
}

.doc-row.expanded .doc-expand-icon { transform: rotate(90deg); }

.doc-detail {
  display: none;
  padding: 0 1rem .75rem 4.5rem;
  font-size: .8rem;
  color: var(--text-muted);
  line-height: 1.8;
}

.doc-row.expanded .doc-detail { display: block; }

.doc-detail .detail-label {
  color: var(--accent-light);
  font-weight: 500;
  margin-right: .5rem;
}

.doc-detail .detail-line { margin-bottom: .25rem; }

/* Progress */
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--surface-3);
  border-radius: 3px;
  overflow: hidden;
  margin: 1rem 0;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--accent));
  border-radius: 3px;
  transition: width .5s ease;
}

.progress-text {
  text-align: center;
  font-size: .85rem;
  font-weight: 600;
  color: var(--accent-light);
  margin-bottom: .5rem;
}

/* Summary Card */
.summary-card {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-bottom: 2rem;
}

.summary-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1rem;
  text-align: center;
}

.summary-item .num {
  font-size: 1.5rem;
  font-weight: 700;
}

.summary-item .label {
  font-size: .7rem;
  color: var(--text-muted);
  margin-top: .25rem;
}

.hidden { display: none; }

@media (max-width: 640px) {
  .field-grid { grid-template-columns: repeat(2, 1fr); }
  .summary-card { grid-template-columns: repeat(3, 1fr); }
  .doc-main { padding: .6rem .75rem; }
  .doc-detail { padding-left: 3rem; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 特定技能2号 書類チェックリスト</h1>
    <p>出入国在留管理庁 令和8年4月改定版 — 分野を選んで書類を確認しましょう</p>
  </header>

  <div class="field-selector">
    <h2>🏭 分野を選択してください</h2>
    <div class="field-grid" id="fieldGrid"></div>
  </div>

  <div id="checklistArea" class="hidden">
    <div class="emp-tabs" id="empTabs"></div>

    <div class="summary-card" id="summaryCards"></div>

    <div class="progress-text" id="progressText">0 / 0 書類完了</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0"></div></div>

    <div id="sections"></div>
  </div>
</div>

const FIELDS = DATA.fields;
const COMMON = DATA.common_documents;
const ORG = DATA.organization_documents;
const FIELD_DOCS = DATA.field_specific_documents;

let selectedField = null;
let selectedEmpType = 'direct';
let checkedDocs = new Set();

// --- Init ---
function init() {
  const grid = document.getElementById('fieldGrid');
  for (const [key, f] of Object.entries(FIELDS)) {
    const btn = document.createElement('button');
    btn.className = 'field-btn';
    btn.dataset.field = key;
    const etypes = f.has_dispatch ? '直接・法人派遣・個人派遣' : '直接雇用のみ';
    btn.innerHTML = `${f.name}<span class="count">${etypes}</span>`;
    btn.onclick = () => selectField(key);
    grid.appendChild(btn);
  }
}

function selectField(key) {
  selectedField = key;
  selectedEmpType = 'direct';
  document.querySelectorAll('.field-btn').forEach(b => b.classList.toggle('active', b.dataset.field === key));
  document.getElementById('checklistArea').classList.remove('hidden');
  renderEmpTabs();
  renderChecklist();
  document.getElementById('checklistArea').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderEmpTabs() {
  const tabs = document.getElementById('empTabs');
  tabs.innerHTML = '';
  const fd = FIELD_DOCS[selectedField];
  if (!fd) return;
  const types = fd.employment_types || ['direct'];
  const labels = { direct:'直接雇用', dispatch_corporate:'法人派遣', dispatch_individual:'個人事業主派遣' };
  types.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'emp-tab' + (t === selectedEmpType ? ' active' : '');
    btn.textContent = labels[t];
    btn.onclick = () => { selectedEmpType = t; renderEmpTabs(); renderChecklist(); };
    tabs.appendChild(btn);
  });
}

function renderChecklist() {
  const sections = document.getElementById('sections');
  sections.innerHTML = '';

  const fd = FIELD_DOCS[selectedField];
  const fieldDocs = fd?.[selectedEmpType] || fd?.direct || [];
  const orgType = selectedEmpType === 'dispatch_individual' ? 'sole_proprietor' : 'corporate';
  const orgDocs = ORG[orgType]?.docs || [];

  // Summary
  const allDocs = [...COMMON.docs, ...orgDocs, ...fieldDocs];
  const autoCount = allDocs.filter(d => d.source === 'auto_generate').length;
  const userCount = allDocs.filter(d => d.source === 'user_prepare').length;
  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-item"><div class="num" style="color:var(--text)">${allDocs.length}</div><div class="label">書類合計</div></div>
    <div class="summary-item"><div class="num" style="color:var(--green)">${autoCount}</div><div class="label">🟢 自動生成</div></div>
    <div class="summary-item"><div class="num" style="color:var(--red)">${userCount}</div><div class="label">🔴 ユーザー用意</div></div>
  `;

  renderSection(sections, '共通書類（第1表）', COMMON.docs, 'common');
  renderSection(sections, `所属機関書類（第2表・${orgType === 'corporate' ? '法人' : '個人事業主'}）`, orgDocs, 'org');
  renderSection(sections, `分野別書類（${FIELDS[selectedField]?.name}）`, fieldDocs, 'field');

  updateProgress();
}

function renderSection(container, title, docs, prefix) {
  if (!docs || docs.length === 0) return;
  const sec = document.createElement('div');
  sec.className = 'section';
  const autoC = docs.filter(d => d.source === 'auto_generate').length;
  const userC = docs.filter(d => d.source === 'user_prepare').length;

  sec.innerHTML = `
    <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
      <h3>${title} <span style="font-size:.75rem;color:var(--text-muted)">(${docs.length}件)</span></h3>
      <div class="section-stats">
        <span style="color:var(--green)">🟢 ${autoC}</span>
        <span style="color:var(--red)">🔴 ${userC}</span>
      </div>
    </div>
    <div class="section-body"></div>
  `;
  const body = sec.querySelector('.section-body');
  docs.forEach((doc, i) => {
    const id = doc.id || `${prefix}-${i}`;
    const isAuto = doc.source === 'auto_generate';
    const row = document.createElement('div');
    row.className = 'doc-row' + (checkedDocs.has(id) ? ' checked' : '');
    row.dataset.id = id;

    let detailHtml = '';
    if (doc.description) detailHtml += `<div class="detail-line"><span class="detail-label">📝 説明:</span>${doc.description}</div>`;
    if (doc.form_ref) detailHtml += `<div class="detail-line"><span class="detail-label">📄 様式:</span>${doc.form_ref}</div>`;
    if (doc.issuer) detailHtml += `<div class="detail-line"><span class="detail-label">🏢 取得先:</span>${doc.issuer}</div>`;
    if (doc.skip_condition) detailHtml += `<div class="detail-line"><span class="detail-label">⚡ 省略:</span>${doc.skip_condition}</div>`;
    if (doc.required_info?.length) detailHtml += `<div class="detail-line"><span class="detail-label">📋 必要情報:</span>${doc.required_info.join(', ')}</div>`;

    row.innerHTML = `
      <div class="doc-main">
        <div class="doc-checkbox" onclick="event.stopPropagation();toggleCheck('${id}')"></div>
        <div class="doc-no ${isAuto ? 'auto' : 'user'}">${doc.no || (i+1)}</div>
        <div class="doc-info">
          <div class="doc-name">${doc.name}</div>
          <div class="doc-meta">
            ${isAuto ? '<span class="badge badge-auto">🟢 自動生成</span>' : '<span class="badge badge-user">🔴 ユーザー用意</span>'}
            ${doc.skip_condition ? ' <span class="badge badge-skip">省略可</span>' : ''}
            ${doc.form_ref ? ` <span style="color:var(--text-muted);font-size:.7rem">📄 ${doc.form_ref}</span>` : ''}
          </div>
        </div>
        <span class="doc-expand-icon">▶</span>
      </div>
      ${detailHtml ? `<div class="doc-detail">${detailHtml}</div>` : ''}
    `;

    row.querySelector('.doc-main').addEventListener('click', (e) => {
      if (!e.target.closest('.doc-checkbox')) row.classList.toggle('expanded');
    });

    body.appendChild(row);
  });
  container.appendChild(sec);
}

function toggleCheck(id) {
  if (checkedDocs.has(id)) checkedDocs.delete(id);
  else checkedDocs.add(id);
  document.querySelectorAll(`.doc-row[data-id="${id}"]`).forEach(r => r.classList.toggle('checked'));
  updateProgress();
}

function updateProgress() {
  const total = document.querySelectorAll('.doc-row').length;
  const checked = checkedDocs.size;
  const pct = total ? Math.round(checked / total * 100) : 0;
  document.getElementById('progressText').textContent = `${checked} / ${total} 書類完了 (${pct}%)`;
  document.getElementById('progressFill').style.width = pct + '%';
}

init();
</script>
</body>
</html>
