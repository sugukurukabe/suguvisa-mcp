# Smithery.ai configuration for SuguVisa MCP Server
# 日本の特定技能ビザ申請を完全自動化するAI MCPサーバー（24ツール搭載）
# https://smithery.ai/server/@a-kabe-1qio/suguvisa-mcp

# ─── リモートサーバー設定 (Cloud Run) ───
# Smithery はこの URL にプロキシして MCP プロトコルを提供する
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      plan:
        type: string
        title: "利用プラン / Subscription Plan"
        default: "free"
        enum:
          - "free"
          - "pro"
          - "enterprise"
        description: >
          利用プラン。free=基本ツール5種（申請判定・書類リスト・期限計算・データ検証・法改正追跡）、
          pro=全24ツール（AI理由書生成・参考様式テンプレート・オンラインCSV/Excel・SSW2チェックリスト・提出前チェック・在留カードOCR等）、
          enterprise=監査ログ・テナント管理・API認証・優先サポート付き。
          / Subscription plan. free=5 basic tools, pro=all 24 tools, enterprise=audit logs & tenant management.
      apiKey:
        type: string
        title: "API Key（Enterprise専用 / Enterprise Only）"
        default: ""
        description: >
          Enterprise プラン用のAPI認証キー。free/proプランでは不要です。
          SuguVisa管理画面 → Settings → API Keys で発行できます。
          / API key for Enterprise plan. Not required for free/pro plans.
        x-from:
          header: x-suguvisa-api-key
      gcpProjectId:
        type: string
        title: "GCP Project ID（任意 / Optional）"
        default: ""
        description: >
          在留カードOCR（Document AI）と法務文書検索（Vertex AI Search）を有効にするために必要。
          これらの機能を使わない場合は空欄のままでOKです。
          例: my-project-123456
          / Required only for residence card OCR and legal document search. Leave empty if not needed.
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        SUGUVISA_PLAN: config.plan || "free",
        SUGUVISA_API_KEY: config.apiKey || "",
        GCP_PROJECT_ID: config.gcpProjectId || ""
      }
    })
