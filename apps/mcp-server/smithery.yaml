# Smithery.ai configuration for SuguVisa MCP Server
# 日本の特定技能ビザ申請を完全自動化するAI MCPサーバー（42ツール搭載・OAuth 2.1対応）
# The only AI MCP server that fully automates Japan's SSW visa applications.
# Satu-satunya server MCP AI yang sepenuhnya mengotomatisasi permohonan visa SSW Jepang.
#
# Registry: https://smithery.ai/server/@a-kabe-1qio/suguvisa-mcp
# Official npm locator: https://www.npmjs.com/package/@suguvisa/mcp-server

# ─── Transport: URL-published remote server ───
# SuguVisa MCP は Cloud Run (asia-northeast1) で自前ホスティングし、Smithery Gateway は
# upstream として https://mcp.suguvisa.com/mcp にプロキシする URL-published 方式。
# 詳細メタデータは /.well-known/mcp/server-card.json で配信している（Static Server Card）。
# 再 publish する場合:
#   smithery mcp publish "https://mcp.suguvisa.com/mcp" \
#     -n @a-kabe-1qio/suguvisa-mcp \
#     --config-schema ./smithery-config-schema.json
#
# SuguVisa MCP is self-hosted on Cloud Run (asia-northeast1). Smithery Gateway proxies
# to https://mcp.suguvisa.com/mcp as an URL-published remote server. Full metadata is
# served from /.well-known/mcp/server-card.json (Static Server Card).
# npm は公式 locator package としてのみ使い、Smithery は Cloud Run 上の MCP endpoint を
# 配布する connector distribution surface として継続利用する。
# npm is used only as an official locator package; Smithery remains the connector
# distribution surface for the hosted Cloud Run MCP endpoint.
#
# SuguVisa MCP di-hosting sendiri di Cloud Run (asia-northeast1). Smithery Gateway
# mem-proxy ke https://mcp.suguvisa.com/mcp sebagai server remote URL-published.
# Metadata lengkap disajikan dari /.well-known/mcp/server-card.json (Static Server Card).
# npm hanya digunakan sebagai paket locator resmi; Smithery tetap menjadi permukaan
# distribusi konektor untuk endpoint MCP Cloud Run yang di-hosting.

runtime: "typescript"

# ─── Session Configuration (ユーザーが Smithery 経由で接続する際の UI) ───
# 正準な configSchema は smithery-config-schema.json に定義。
# Smithery Gateway はこのスキーマから OAuth UI フォームを自動生成する。
# The canonical configSchema is defined in smithery-config-schema.json.
# Skema konfigurasi kanonik didefinisikan di smithery-config-schema.json.

startCommand:
  type: "http"
  configSchema:
    type: object
    required: []
    properties:
      plan:
        type: string
        title: "Subscription Plan"
        default: "free"
        enum:
          - "free"
          - "starter"
          - "professional"
        description: >
          利用プラン。free=全42ツールを試用可（OCR/一括生成/自律ワークフローはゲート）、
          starter=実務プラン（OCR・一括生成・監査ログ・年次報告、19,800円/月）、
          professional=フル機能（法令検索・自律ワークフロー、49,800円/月）。
          / Subscription tier. free = try all 42 tools (OCR/bulk/autonomous gated),
          starter = production use with OCR + bulk + audit + annual report (19,800 JPY/mo),
          professional = full feature set with legal search + autonomous workflow (49,800 JPY/mo).
          / Paket. free = coba semua 42 alat (OCR/bulk/autonomous dibatasi),
          starter = pemakaian produksi dengan OCR + bulk + audit + laporan tahunan (19.800 JPY/bulan),
          professional = fitur lengkap dengan pencarian hukum + alur kerja otonom (49.800 JPY/bulan).
      apiKey:
        type: string
        title: "API Key"
        default: ""
        description: >
          SuguVisa ダッシュボード発行の API キー。starter / professional プランでは必須、
          free プランでは任意（未認証アクセスはレート制限が厳しくなります）。
          発行先: https://suguvisa.com/dashboard/api-keys
          / SuguVisa API key. Required for starter / professional plans, optional for free tier
          (unauthenticated access uses stricter rate limits).
          Issued at https://suguvisa.com/dashboard/api-keys
          / Kunci API SuguVisa. Wajib untuk paket starter / professional, opsional untuk paket free
          (akses tanpa autentikasi memiliki batas laju yang lebih ketat).
          Terbitkan di https://suguvisa.com/dashboard/api-keys
        x-from:
          header: x-suguvisa-api-key
      gcpProjectId:
        type: string
        title: "GCP Project ID (Optional)"
        default: ""
        description: >
          独自の GCP Project ID。在留カード OCR (Document AI) と法令検索 (Vertex AI Search) を
          自分の GCP クォータで動かしたい場合のみ指定。空欄で SuguVisa マネージドクォータを使用。
          / Your own GCP Project ID. Specify only if you want residence card OCR (Document AI)
          and legal document search (Vertex AI Search) to run on your own GCP quota.
          Leave empty to use SuguVisa's managed quota.
          / ID Proyek GCP Anda. Isi hanya jika ingin OCR kartu izin tinggal (Document AI)
          dan pencarian dokumen hukum (Vertex AI Search) berjalan pada kuota GCP Anda sendiri.
          Kosongkan untuk menggunakan kuota terkelola SuguVisa.
  exampleConfig:
    plan: "free"
    apiKey: ""
    gcpProjectId: ""
