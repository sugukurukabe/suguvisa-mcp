# ─────────────────────────────────────────────────────────────
# SuguVisa Dashboard — Cloud Build config
#
# 使い方 / Usage / Penggunaan:
#   gcloud builds submit \
#     --config apps/dashboard/cloudbuild.yaml \
#     --substitutions \
# _NEXT_PUBLIC_SUPABASE_URL=https://xxxx.supabase.co,\
# _NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOi...,\
# _NEXT_PUBLIC_SUGUVISA_API_URL=https://mcp.suguvisa.com,\
# _NEXT_PUBLIC_SITE_URL=https://suguvisa.com \
#     .
#
# NEXT_PUBLIC_* は client bundle に焼き込まれるので build 時に渡す必要がある。
# ─────────────────────────────────────────────────────────────

substitutions:
  _IMAGE: gcr.io/${PROJECT_ID}/suguvisa-dashboard
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_SUGUVISA_API_URL: "https://mcp.suguvisa.com"
  _NEXT_PUBLIC_SITE_URL: "https://suguvisa.com"
  _NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/dashboard/Dockerfile
      - -t
      - ${_IMAGE}:$SHORT_SHA
      - -t
      - ${_IMAGE}:latest
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_SUGUVISA_API_URL=${_NEXT_PUBLIC_SUGUVISA_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - .

images:
  - ${_IMAGE}:$SHORT_SHA
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
