# Smithery.ai configuration for SuguVisa MCP Server
# 日本の特定技能ビザ申請を完全自動化するAI MCPサーバー
# https://smithery.ai/server/@a-kabe-1qio/suguvisa-mcp

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      SUGUVISA_API_KEY:
        type: string
        default: ""
        title: "SuguVisa API Key"
        description: "API認証キー。省略時はローカルモード（認証なし）で起動。本番運用時は設定推奨。 / API key for authentication. Omit for local use without auth."
      GCP_PROJECT_ID:
        type: string
        default: ""
        title: "Google Cloud Project ID"
        description: "在留カードOCR（Document AI）と法務文書検索（Vertex AI Search）に必要。これらを使わない場合は省略可。 / Required only for residence card OCR and legal document search."
      GOOGLE_APPLICATION_CREDENTIALS:
        type: string
        default: ""
        title: "GCP Service Account Key Path"
        description: "GCPサービスアカウントキーJSONのパス。GCP_PROJECT_IDと合わせて設定。 / Path to GCP service account key JSON."
      SUPABASE_URL:
        type: string
        default: ""
        title: "Supabase URL"
        description: "監査ログ・申請結果フィードバック用。省略時はメモリ内ストレージ使用。 / For audit logging. Falls back to in-memory storage if omitted."
      SUPABASE_SERVICE_KEY:
        type: string
        default: ""
        title: "Supabase Service Key"
        description: "Supabaseサービスキー。SUPABASE_URLと合わせて設定。 / Supabase service role key, used with SUPABASE_URL."
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        SUGUVISA_API_KEY: config.SUGUVISA_API_KEY || "",
        GCP_PROJECT_ID: config.GCP_PROJECT_ID || "",
        GOOGLE_APPLICATION_CREDENTIALS: config.GOOGLE_APPLICATION_CREDENTIALS || "",
        SUPABASE_URL: config.SUPABASE_URL || "",
        SUPABASE_SERVICE_KEY: config.SUPABASE_SERVICE_KEY || ""
      }
    })
